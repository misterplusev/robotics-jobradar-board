<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ABET | Robotics Jobs</title><link rel="stylesheet" href="standalone.css?v=20261110-2"><style>.abet-chip-perspective{perspective:620px;width:76px;height:76px}
.abet-chip-spinner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:abet-chip-flip 2.4s cubic-bezier(.45,.05,.35,1) infinite}
.abet-chip-face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;border:3px solid #FDB515;outline:1px solid rgba(253,181,21,0.45);outline-offset:-5px;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,0.16),transparent 34%),radial-gradient(circle at 68% 78%,rgba(253,181,21,0.10),transparent 40%),radial-gradient(circle at 34% 30%,#29405a 0%,#16222f 45%,#0d131c 68%,#070B0F 100%);box-shadow:0 0 28px rgba(253,181,21,0.34),0 0 64px rgba(253,181,21,0.12),inset 0 0 18px rgba(253,181,21,0.14),inset 0 2px 6px rgba(0,0,0,0.65)}
.abet-chip-seg{position:absolute;left:50%;top:2px;width:8px;height:10px;margin-left:-4px;border-radius:3px;background:linear-gradient(180deg,rgba(255,214,102,1) 0%,rgba(253,181,21,0.92) 45%,rgba(180,120,8,0.9) 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,0.45),inset 0 -1px 2px rgba(80,50,0,0.6);transform-origin:50% 36.0px}
.abet-chip-txt{font-family:'Times New Roman',serif;font-weight:700;font-size:43px;line-height:.88;transform:translateY(-1px);color:#FDB515;text-shadow:0 0 6px rgba(253,181,21,0.95),0 0 22px rgba(253,181,21,0.55),0 0 42px rgba(253,181,21,0.28)}
.abet-chip-back{transform:rotateY(180deg)}
.abet-chip-loader{display:flex;flex-direction:column;align-items:center;gap:16px;padding:38px 0}
@keyframes abet-chip-flip{0%{transform:rotateY(0deg) translateY(0)}45%{transform:rotateY(540deg) translateY(-10px)}70%{transform:rotateY(720deg) translateY(0)}78%{transform:rotateY(720deg) translateY(-3px)}86%{transform:rotateY(720deg) translateY(0)}100%{transform:rotateY(720deg) translateY(0)}}
@media (prefers-reduced-motion:reduce){.abet-chip-spinner{animation:none !important}}
</style></head><body><main class="jobs-board">
<header class="board-header"><a class="abet-wordmark" href="https://abet-dashboard.vercel.app/?section=jobs" aria-label="ABET dashboard"><span class="abet-alpha" aria-hidden="true">α</span><span class="abet-word" aria-hidden="true">bet</span></a><div class="board-heading"><h1>Robotics Jobs</h1><p class="board-subtitle">Career opportunities from employer sources.</p></div><nav class="board-links" aria-label="Job board links"><a href="https://abet-dashboard.vercel.app/?section=jobs">All job boards</a><a href="https://github.com/misterplusev/job-radar/actions/workflows/pipeline.yml">Scraper health</a></nav></header>
<details class="board-overview" open><summary><span>Summary &amp; companies</span><span id="overview-counts" class="overview-counts">Loading…</span></summary><div class="overview-body"><div class="overview-tools"><div class="overview-stats" id="overview-stats"></div><div class="scroll-buttons"><button id="companies-left" type="button" aria-label="Scroll companies left">←</button><button id="companies-right" type="button" aria-label="Scroll companies right">→</button></div></div><div id="pills" class="company-scroll" role="region" aria-label="Companies filters" tabindex="0"></div></div></details>
<div id="filters" class="controls board-controls">
 <input id=q aria-label="Search jobs" placeholder="search title / company / location" size=32>
 <select id=loc><option value="">all locations</option></select>
 <select id=src><option value="">all sources</option></select>
 <select id=st><option value="">active + closed</option><option value="1" selected>active only</option><option value="0">closed only</option><option value="applied">applied only</option></select>
 <label>Sort <select id=sort><option value="newest">Newest posted first</option><option value="oldest">Oldest posted first</option><option value="company">Company A–Z</option><option value="title">Title A–Z</option><option value="location">Location A–Z</option></select></label>
 <label>Start with <select id=limit><option>100</option><option>200</option><option>500</option><option value="all">All</option></select></label>
 <label><input type=checkbox id=international> Include international &amp; unspecified locations</label>
 <label><input type=checkbox id=rem> remote only</label>
 <label title="Hides postings from pure-software companies (Databricks, OpenAI, Stripe, Anthropic, Airbnb, Coinbase, Robinhood, Ramp, Figma) and the Figure Lending mortgage board. These boards are scraped as seed sources but are not robotics employers."><input type=checkbox id=offtopic checked> hide off-topic</label>
 </div>
<div id=status class="board-status" style=display:none></div>
<div id=ofnote class=muted style="padding:0 20px 6px;display:none"></div>
<div id=loading class=loading-wrap>
 <div class=abet-chip-loader role=status aria-live=polite><div class=abet-chip-perspective><div class=abet-chip-spinner><div class=abet-chip-face><span class=abet-chip-seg style="transform:rotate(0deg)"></span><span class=abet-chip-seg style="transform:rotate(45deg)"></span><span class=abet-chip-seg style="transform:rotate(90deg)"></span><span class=abet-chip-seg style="transform:rotate(135deg)"></span><span class=abet-chip-seg style="transform:rotate(180deg)"></span><span class=abet-chip-seg style="transform:rotate(225deg)"></span><span class=abet-chip-seg style="transform:rotate(270deg)"></span><span class=abet-chip-seg style="transform:rotate(315deg)"></span><span class=abet-chip-txt>α</span></div><div class="abet-chip-face abet-chip-back"><span class=abet-chip-seg style="transform:rotate(0deg)"></span><span class=abet-chip-seg style="transform:rotate(45deg)"></span><span class=abet-chip-seg style="transform:rotate(90deg)"></span><span class=abet-chip-seg style="transform:rotate(135deg)"></span><span class=abet-chip-seg style="transform:rotate(180deg)"></span><span class=abet-chip-seg style="transform:rotate(225deg)"></span><span class=abet-chip-seg style="transform:rotate(270deg)"></span><span class=abet-chip-seg style="transform:rotate(315deg)"></span><span class=abet-chip-txt>α</span></div></div></div></div>
 <div id=loadprogress class=muted>Loading jobs...</div>
</div>
<div id="results" class="board-results" aria-live="polite"></div><div id="tblwrap" style="display:none"><div id="tb" class="job-list"></div></div><div id="sentinel" class="board-more"><button id="more" type="button" hidden>Show more</button><span id="more-note"></span></div>
<script type="module">
import { jobCardMarkup, wireJobDetails, wireCompanyScroll } from './standalone-ui.mjs';
import { compareJobs, jobGeography, postedLabel, initialVisibleCount, nextVisibleCount, fetchAllJobRows } from './job-board-core.mjs';
const SB_URL="https://alxgteasytezekyunyjk.supabase.co", SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseGd0ZWFzeXRlemVreXVueWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDg0NzgsImV4cCI6MjA5MDUyNDQ3OH0.jpeiWLBepn1O1BeDFJMaM28iWxwRgMA0zIckit6g4Cc", POLL="hourly";
const international=document.getElementById('international'), limit=document.getElementById('limit'), sort=document.getElementById('sort'), more=document.getElementById('more');
let shown=100, matching=0, observer;
let DATA=[], sortK="posted_at", asc=false, APPLIED=new Set(), COMP=new Set();
const tb=document.getElementById("tb"), q=document.getElementById("q"),
 src=document.getElementById("src"), st=document.getElementById("st"), rem=document.getElementById("rem"),
 loc=document.getElementById("loc"), pills=document.getElementById("pills"),
 ofc=document.getElementById("offtopic"),
 cnt=document.getElementById("status"), loadwrap=document.getElementById("loading"),
 tblwrap=document.getElementById("tblwrap"), loadprogress=document.getElementById("loadprogress"),
 ofnote=document.getElementById("ofnote");
// Off-topic = pure-software companies that were added to config/targets.json as seed
// sources, plus the `figure` Greenhouse slug which is Figure LENDING (mortgage/insurance),
// not Figure AI. Figure AI lives at /figureai/ once the target is corrected.
// Keep OFFTOPIC_COMPANIES in sync with STRICT_TITLE_ONLY_COMPANIES in jobradar/relevance.py.
const OFFTOPIC_COMPANIES=new Set(["anthropic","databricks","stripe","coinbase","figma","airbnb","robinhood","ramp","openai"]);
const OFFTOPIC_URL=/\/(figure|figure-lending)\/jobs\//i;
// Mirror of _norm_company() in jobradar/relevance.py: providers report the same
// employer inconsistently ("Stripe" / "Stripe, Inc." / "stripe inc"), so strip
// corporate suffixes before comparing.
const CORP_SUFFIXES=["incorporated","corporation","corp","company","holdings","group","technologies","technology","labs","plc","llc","ltd","inc","sa","gmbh","pbc","llp","pllc","limited","bv","nv"];
function normCompany(name){
 let flat=(""+(name||"")).toLowerCase().replace(/[^a-z0-9]/g,"");
 let changed=true;
 while(changed&&flat.length>4){
  changed=false;
  for(const s of CORP_SUFFIXES){
   if(flat.endsWith(s)&&flat.length-s.length>=3){flat=flat.slice(0,flat.length-s.length);changed=true}
  }
 }
 return flat;
}
function isOffTopic(d){
 return OFFTOPIC_COMPANIES.has(normCompany(d.company))||OFFTOPIC_URL.test(d.url||"");
}
function slugify(name){return (""+(name||"")).toLowerCase().replace(/ /g,"-").replace(/\./g,"-")}
function esc(s){return (""+(s||"")).replace(/&/g,"\x26amp;").replace(/</g,"\x26lt;").replace(/>/g,"\x26gt;").replace(/"/g,"\x26quot;").replace(/'/g,"\x26#39;")}
const PALETTE=["#58a6ff","#3fb950","#f778ba","#d29922","#a371f7","#39c5cf","#ff7b72","#7ee787","#f0883e","#79c0ff","#db61a2","#56d364","#e3b341","#ffa657"];
function colorOf(name){let h=0;for(const ch of (""+name))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function setCtrlH(){document.documentElement.style.setProperty("--ctrl-h",(document.querySelector(".controls").offsetHeight+1)+"px")}
const akey=(c,u)=>c+"\u0001"+u;
const SBH={apikey:SB_ANON,Authorization:"Bearer "+SB_ANON};
async function loadApplied(){
 const set=new Set(); let off=0;
 try{
  while(true){
   const r=await fetch(SB_URL+"/rest/v1/robotics_applications?select=company,job_url&limit=1000&offset="+off,{headers:SBH});
   if(!r.ok)break;
   const pg=await r.json(); pg.forEach(a=>set.add(akey(a.company,a.job_url)));
   if(pg.length<1000)break; off+=1000;
  }
 }catch(e){}
 return set;
}
async function toggleApplied(company,url,title){
 const key=akey(company,url);
 try{
  if(APPLIED.has(key)){
   const f="company=eq."+encodeURIComponent(company)+"&job_url=eq."+encodeURIComponent(url);
   const r=await fetch(SB_URL+"/rest/v1/robotics_applications?"+f,{method:"DELETE",headers:SBH});
   if(r.ok){APPLIED.delete(key);render(false)}
  }else{
   const r=await fetch(SB_URL+"/rest/v1/robotics_applications",{method:"POST",headers:Object.assign({},SBH,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"}),body:JSON.stringify([{company:company,job_url:url,job_title:title}])});
   if(r.ok){APPLIED.add(key);render(false)}
  }
 }catch(e){}
}
async function load(){
 APPLIED=await loadApplied();
 let rows;
 try { rows=await fetchAllJobRows({url:SB_URL,key:SB_ANON,table:'robotics_jobs',columns:'id,company,title,url,location,ats,posted_at,is_active,scraped_at',onProgress:n=>loadprogress.textContent='Loaded '+n.toLocaleString()+' jobs…'}) }
 catch(e){loadwrap.style.display='none';cnt.style.display='block';cnt.textContent=e.message;return}
 DATA=rows;
 loadwrap.style.display="none";
 tblwrap.style.display="block";
 cnt.style.display="block";
 const counts={};
 DATA.forEach(d=>{if(d.company)counts[d.company]=(counts[d.company]||0)+(d.is_active?1:0)});
 const companies=Object.keys(counts).sort((a,b)=>a.localeCompare(b));
 pills.innerHTML="<button class='co-pill all active' aria-pressed='true' data-c=''>All</button>"+companies.map(c=>"<button class='co-pill' aria-pressed='false' data-c=\""+esc(c)+"\"><img src='logos/"+slugify(c)+".png' onerror=\"this.style.display='none'\"><span>"+esc(c)+"</span><span class='cnt'>"+counts[c]+"</span></button>").join("");
 setCtrlH();
 const sources=[...new Set(DATA.map(d=>d.ats).filter(Boolean))].sort();
 src.innerHTML="<option value=''>all sources</option>"+sources.map(s=>"<option>"+esc(s)+"</option>").join("");
 const locations=[...new Set(DATA.map(d=>(d.location||"").trim()).filter(Boolean))].sort();
 loc.innerHTML="<option value=''>all locations</option>"+locations.map(l=>"<option>"+esc(l)+"</option>").join("");
 const active=DATA.filter(d=>d.is_active).length;
 const lastS=DATA.map(d=>d.scraped_at).filter(Boolean).sort().pop();
 let poll="";
 if(lastS){const mins=Math.max(0,Math.round((Date.now()-new Date(lastS).getTime())/60000));const rtxt=mins<60?mins+"m":Math.floor(mins/60)+"h "+(mins%60)+"m";poll=" · polling: "+POLL+" · last scrape "+rtxt+" ago"}
 cnt.textContent=DATA.length.toLocaleString()+" jobs loaded"+poll;
 document.getElementById('overview-counts').textContent=active.toLocaleString()+' active';
 document.getElementById('overview-stats').textContent=DATA.length.toLocaleString()+' total · '+active.toLocaleString()+' active · '+(DATA.length-active).toLocaleString()+' closed';
 render();
}
function render(reset=true){
 if(reset!==false)shown=initialVisibleCount(limit.value);
 let hidden=0;
 let r=DATA.filter(d=>{
  if(!international.checked&&jobGeography(d)!=="us")return false;
  if(ofc.checked&&isOffTopic(d)){hidden++;return false}
  if(st.value==="applied"){if(!APPLIED.has(akey(d.company,d.url)))return false}
  else if(st.value!==""&&String(d.is_active?1:0)!==st.value)return false;
  if(COMP.size&&!COMP.has(d.company))return false;
  if(loc.value&&(d.location||"").trim()!==loc.value)return false;
  if(src.value&&d.ats!==src.value)return false;
  if(rem.checked&&!/remote/i.test(d.location))return false;
  const t=(q.value||"").toLowerCase();
  return !t||(d.title+" "+d.company+" "+d.location).toLowerCase().includes(t);});
 r.sort((a,b)=>sortK==='posted_at'?compareJobs(a,b,asc?'oldest':'newest'):(asc?1:-1)*String(a[sortK]||'').localeCompare(String(b[sortK]||''),undefined,{numeric:true}));
 matching=r.length;
 document.getElementById('results').textContent='Showing '+Math.min(shown,matching).toLocaleString()+' of '+matching.toLocaleString()+' matches · '+(international.checked?'All locations':'U.S. locations only');
 more.hidden=shown>=matching;
 document.getElementById('more-note').textContent=limit.value==='all'&&shown<matching?' All matches — loads as you scroll':'';
 observer?.disconnect();
 if(limit.value==='all'&&shown<matching&&globalThis.IntersectionObserver){observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting){shown=nextVisibleCount(shown,limit.value,matching);render(false)}},{rootMargin:'300px'});observer.observe(document.getElementById('sentinel'))}
 ofnote.style.display=hidden?"":"none";
 ofnote.textContent=hidden?("showing "+r.length+" of "+(r.length+hidden)+" — hiding "+hidden+" off-topic posting"+(hidden===1?"":"s")+" from pure-software boards"):"";
 tb.innerHTML=r.slice(0,shown).map(d=>jobCardMarkup(d,{logoUrl:new URL('logos/'+slugify(d.company)+'.png',document.baseURI).href,applied:APPLIED.has(akey(d.company,d.url))})).join('');
 if(!r.length)tb.innerHTML='<p class="muted">No jobs match these filters.</p>';
}
wireJobDetails(tb,{url:SB_URL,key:SB_ANON,table:'robotics_jobs'});
wireCompanyScroll(pills,document.getElementById('companies-left'),document.getElementById('companies-right'));
pills.addEventListener("click",e=>{
 const b=e.target.closest(".co-pill"); if(!b)return;
 const c=b.dataset.c;
 if(!c){COMP.clear()}
 else if(COMP.has(c))COMP.delete(c); else COMP.add(c);
 pills.querySelectorAll(".co-pill").forEach(p=>{
  const pc=p.dataset.c, col=pc?colorOf(pc):"#FFD600";
  const on=!pc?COMP.size===0:COMP.has(pc);
  p.classList.toggle("active",on); p.setAttribute("aria-pressed",String(on));
  p.style.borderColor=on?col:""; p.style.background=on?col+"22":"";
 });
 render();
});
tb.addEventListener("click",e=>{
 const b=e.target.closest(".apply-btn"); if(!b)return;
 toggleApplied(b.dataset.c,b.dataset.u,b.dataset.t);
});
[q,loc,src,st,rem,international,limit,ofc].forEach(el=>el.addEventListener("input",render));
sort.addEventListener('change',()=>{sortK=['newest','oldest'].includes(sort.value)?'posted_at':sort.value;asc=sort.value!=='newest';render()});
more.addEventListener('click',()=>{shown=nextVisibleCount(shown,limit.value,matching);render(false)});
window.addEventListener("resize",setCtrlH);
new ResizeObserver(setCtrlH).observe(document.querySelector(".controls"));
load();
</script></main></body></html>
